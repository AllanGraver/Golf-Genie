<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#064e3b"
  >

  <title>Golf Genie</title>

  <link
    rel="stylesheet"
    href="./assets/css/tokens.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/components.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/app.css"
  >

</head>

<body>

  <header id="appHeader"></header>

  <div class="app-shell">

    <aside id="sideNav"></aside>

    <main
      id="app"
      aria-live="polite"
    ></main>

  </div>

  <nav id="bottomNav"></nav>

  <input
    id="trackmanFile"
    type="file"
    accept=".csv,text/csv"
    hidden
  >

  <input
    id="garminFile"
    type="file"
    accept=".json,.csv,application/json,text/csv"
    hidden
  >

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script
    type="module"
    src="./assets/js/app.js">
  </script>
  
</body>
</html>
