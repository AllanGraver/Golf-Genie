<!doctype html>
<html lang="da">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#064e3b"
  >

  <title>Golf Genie</title>

  assets/css/tokens.css

  <link
    rel="stylesheet"
    href/css/app.css
</head>

<body>

  <header id="appHeader"></header>

  <div class="app-shell">

    <aside id="sideNav"></aside>

    <main
      id="app"
      aria-live="polite"
    ></main>

  </div>

  <nav id="bottomNav"></nav>

  <!-- TrackMan -->

  <input
    id="trackmanFile"
    type="file"
    accept=".csv,text/csv"
    hidden
  >

  <!-- Garmin CSV / JSON -->

  <input
    id="garminFile"
    type="file"
    accept=".json,.csv,application/json,text/csv"
    hidden
  >

  <!-- OCR Engine -->

  <script src="https://cdn.jsdelivr.net/npm/5/dist/tesseract.min.jsscript>

  <!-- App -->

  assets/js/app.jsscript>

</body>

</html>
